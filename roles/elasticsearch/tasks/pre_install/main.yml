---
- name: Systemd unit file overrides
  when:
    - elasticsearch_systemd_service_overrides is defined
    - elasticsearch_systemd_service_overrides | length > 0
  block:
    - name: Ensure systemd override dir exists
      ansible.builtin.file:
        path: /etc/systemd/system/elasticsearch.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Override systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/elasticsearch.service.d/override.conf
        content: |
          {{ elasticsearch_systemd_service_overrides }}
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reload systemd
        - Restart Elasticsearch

- name: Disable swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: 1
    state: present
    reload: true

- name: Increase vm.max_map_count for Elasticsearch
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ elasticsearch_vm_max_map_count | default(262144) }}"
    state: present
    reload: true
