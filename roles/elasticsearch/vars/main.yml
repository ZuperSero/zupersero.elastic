---
elasticsearch_major_version: "{{ elasticsearch_version.split('.')[0] | default('9') }}"
elasticsearch_config_dir: "{{ '/etc/elasticsearch' if elasticsearch_install_method == 'package' else '/usr/share/elasticsearch/config' }}"

# Base JVM options (internal, always included)
_elasticsearch_jvm_base_options: |
  -Xms{{ elasticsearch_jvm_heap_size }}
  -Xmx{{ elasticsearch_jvm_heap_size }}

