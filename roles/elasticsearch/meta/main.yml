---
galaxy_info:
  author: zupersero
  description: Install and configure Elasticsearch

  license: GPL-3.0-or-later

  min_ansible_version: "2.19"

  platforms:
    - name: Debian
      versions:
        - trixie
    - name: Ubuntu
      versions:
        - noble
    - name: EL
      versions:
        - "10"

  galaxy_tags:
    - elasticsearch
    - elastic
    - elk
    - search

dependencies: []

argument_specs:
  main:
    short_description: Install and configure Elasticsearch
    description:
      - This role installs and configures Elasticsearch
      - Supports Debian and RedHat based systems
    options:
      elasticsearch_version:
        description: Version of Elasticsearch to install
        type: str
        default: "9.2.1"
      elasticsearch_bootstrap:
        description: Enable bootstrap tasks
        type: bool
        default: false
      elasticsearch_home:
        description: Elasticsearch home directory
        type: str
        default: "/usr/share/elasticsearch"
      elasticsearch_allow_downgrade:
        description: Allow downgrading Elasticsearch
        type: bool
        default: false
      elasticsearch_download_timeout:
        description: Timeout in seconds for repository signing key downloads
        type: int
        default: 30
      elasticsearch_package_install_timeout:
        description: Maximum runtime in seconds for package manager operations
        type: int
        default: 1800
      elasticsearch_systemd_service_overrides:
        description: Systemd service override content
        type: str
        default: ""
      elasticsearch_vm_max_map_count:
        description: Kernel vm.max_map_count setting
        type: int
        default: 262144
      elasticsearch_user:
        description: Elasticsearch system user
        type: str
        default: "elasticsearch"
      elasticsearch_group:
        description: Elasticsearch system group
        type: str
        default: "elasticsearch"
      elasticsearch_config_content:
        description: Elasticsearch configuration as YAML dict
        type: dict
      elasticsearch_jvm_heap_size:
        description: JVM heap size
        type: str
        default: "8g"
      elasticsearch_jvm_extra_options:
        description: Additional JVM options
        type: str
        default: ""
      elasticsearch_security_enable_default:
        description: Enable default security configuration
        type: bool
        default: false
      elasticsearch_secure_config:
        description: Keystore settings dict
        type: dict
        default: {}
      elasticsearch_bootstrap_password:
        description: Bootstrap password for security setup. Required when elasticsearch_bootstrap is true.
        type: str
