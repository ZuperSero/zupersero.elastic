name: Molecule Tests

on:
    push:
        branches:
            - main
            - dev
        paths:
            - 'extensions/**'
            - 'roles/**'
            - '.github/workflows/molecule.yml'

jobs:
    # Keep scenario, Stack, and Python lists easy to edit as coverage evolves.
    molecule:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                scenario: ["elasticsearch", "elastic_agent"]
                elastic: ["9.2.0", "9.4.0", "9.5.0"]
                python: ["3.11", "3.12", "3.13"]
            fail-fast: false
            max-parallel: 1
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python }}

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install molecule molecule-plugins[docker] ansible-core

            - name: Build and install collection
              run: |
                  ansible-galaxy collection build
                  ansible-galaxy collection install zupersero-elastic-*.tar.gz
                  ansible-galaxy collection install community.general
                  ansible-galaxy collection install ansible.posix

            - name: Run Molecule test
              run: molecule test --scenario-name ${{ matrix.scenario }}
              working-directory: extensions
              env:
                  ANSIBLE_FORKS: "1"
                  ELASTICSEARCH_VERSION: ${{ matrix.elastic }}
                  MOLECULE_SCENARIO: ${{ matrix.scenario }}
            - name: Clean up Docker resources
              if: always()
              run: |
                  docker ps -aq | xargs -r docker rm -f
                  docker network prune -f
                  docker volume prune -f
