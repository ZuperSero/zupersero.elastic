name: Molecule Tests

on:
    push:
        branches:
            - main
            - dev

jobs:
    # First job: discover all scenarios
    discover-scenarios:
        runs-on: ubuntu-latest
        outputs:
            scenarios: ${{ steps.set-scenarios.outputs.scenarios }}
        steps:
            - uses: actions/checkout@v4

            - name: Discover Molecule scenarios
              id: set-scenarios
              run: |
                  scenarios=$(ls -1 extensions/molecule | jq -R -s -c 'split("\n")[:-1]')
                  echo "scenarios=$scenarios" >> $GITHUB_OUTPUT

    # Second job: run tests in matrix
    molecule:
        needs: discover-scenarios
        runs-on: ubuntu-latest
        strategy:
            matrix:
                scenario: ${{ fromJson(needs.discover-scenarios.outputs.scenarios) }}
            fail-fast: false
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install molecule molecule-plugins[docker] ansible-core

            - name: Build and install collection
              run: |
                  ansible-galaxy collection build
                  ansible-galaxy collection install zupersero-elastic-*.tar.gz
                  ansible-galaxy collection install community.general
                  ansible-galaxy collection install ansible.posix

            - name: Run Molecule test
              run: molecule test --scenario-name ${{ matrix.scenario }}
              working-directory: extensions
              env:
                  ANSIBLE_FORKS: "1"
