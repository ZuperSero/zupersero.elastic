---

name: Run ansible tests
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ dev ]

jobs:
  ansible-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testing_type: [ sanity, integration ]
        python: [ "3.11" ]
        ansible_core: [ "stable-2.14" ]
    steps:
      - uses: actions/checkout@v4
      - name: Run ${{ matrix.testing_type }} tests (py ${{ matrix.python }})
        uses: ansible-community/ansible-test-gh-action@release/v1.17.0
        with:
          ansible-core-version: ${{ matrix.ansible_core }}
          testing-type: ${{ matrix.testing_type }}
          target-python-version: ${{ matrix.python }}
          controller-python-version: auto
