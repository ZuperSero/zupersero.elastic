name: Run ansible sanity tests
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ dev ]

jobs:
  ansible-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [ "3.11" ]
        ansible_core: [ "stable-2.19.5" ]
    steps:
      - uses: actions/checkout@v4
      - name: Run sanity tests (py ${{ matrix.python }})
        uses: ansible-community/ansible-test-gh-action@release/v1
        with:
          ansible-core-version: ${{ matrix.ansible_core }}
          testing-type: sanity
          target-python-version: ${{ matrix.python }}
          controller-python-version: auto
