name: Unit Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "plugins/**"
      - "tests/unit/**"
      - ".github/workflows/ansible-test-units.yml"
  push:
    branches: [dev]
    paths:
      - "plugins/**"
      - "tests/unit/**"
      - ".github/workflows/ansible-test-units.yml"

jobs:
  ansible-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Keep these lists aligned with the integration workflow.
        python: ["3.11", "3.12", "3.13"]
        ansible_core: ["2.19.5"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core==${{ matrix.ansible_core }}" coverage passlib pytest
      - name: Run unit tests (Python ${{ matrix.python }})
        run: ansible-test units --python ${{ matrix.python }} --color yes
