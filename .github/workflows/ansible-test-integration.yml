name: Run ansible integration tests
on:
    pull_request:
        branches: [main]
        paths:
            - 'tests/integration/**'
            - '.github/workflows/ansible-test-integration.yml'
    push:
        branches: [dev]
        paths:
            - 'tests/integration/**'
            - '.github/workflows/ansible-test-integration.yml'

jobs:
    ansible-test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                elastic: ["9.2.0"]
                ansible_core: ["v2.19.5"]
        steps:
            - name: Get elasticsearch
              run: curl -fsSL https://elastic.co/start-local | sh -s -- -v ${{ matrix.elastic }}

            - name: Edit .env file
              run: |
                  mkdir -p elastic-start-local
                  cat > elastic-start-local/.env << 'EOF'
                  ES_LOCAL_VERSION=${{ matrix.elastic }}
                  ES_LOCAL_CONTAINER_NAME=es-local-dev
                  ES_LOCAL_PASSWORD=changeme
                  ES_LOCAL_PORT=9200
                  ES_LOCAL_URL=http://localhost:9200
                  ES_LOCAL_DISK_SPACE_REQUIRED=1gb
                  ES_LOCAL_JAVA_OPTS="-Xms128m -Xmx4g"
                  KIBANA_LOCAL_CONTAINER_NAME=kibana-local-dev
                  KIBANA_LOCAL_SETTINGS_CONTAINER_NAME=kibana-local-settings
                  KIBANA_LOCAL_PORT=5601
                  KIBANA_LOCAL_PASSWORD=B40G7PN1
                  KIBANA_ENCRYPTION_KEY=KMXBLZem8QWOOMx1YrSabx8p9oHSz6Dp
                  ES_LOCAL_API_KEY=VnhJQVZwb0JkbG93aG10STB2c246TTZ5ZVZXNUEtVFdFZkNITjdLSG90QQ==
                  EOF

            - name: Start elastic
              run: elastic-start-local/start.sh

            - name: Wait for Elasticsearch
              run: |
                set -euo pipefail
                for i in {1..15}; do
                if curl -fsS -u "elastic:changeme" "http://localhost:9200/_cluster/health" | grep -qE '"status":"(green|yellow)"'; then
                    echo "Elasticsearch is ready."
                    exit 0
                fi
                echo "Waiting for Elasticsearch... ($i/15)"
                sleep 5
                done
                echo "Elasticsearch did not become ready after 15 attempts."
                exit 1

            - name: Wait for Kibana
              run: |
                set -euo pipefail
                for i in {1..15}; do
                if curl -fsS -u "elastic:changeme" -H "kbn-xsrf: true" "http://localhost:5601/api/status" | grep -q '"level":"available"'; then
                    echo "Kibana is ready."
                    exit 0
                fi
                echo "Waiting for Kibana... ($i/15)"
                sleep 5
                done
                echo "Kibana did not become ready after 15 attempts."
                exit 1

            - uses: actions/checkout@v4
            - name: Run integration tests (py 3.11.13)
              uses: ansible-community/ansible-test-gh-action@release/v1
              with:
                  ansible-core-version: ${{ matrix.ansible_core }}
                  testing-type: integration
                  target-python-version: 3.11.13
                  controller-python-version: auto

            - name: Dump docker logs on failure
              if: failure()
              run: |
                  docker ps -a
                  docker logs es-local-dev || true
                  docker logs kibana-local-dev || true
                  docker logs kibana-local-settings || true
