---
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: galaxy-release-${{ github.repository }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    # Prereleases are intentionally not published to Galaxy.
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collection tooling
        run: python -m pip install --upgrade pip "ansible-core==2.19.5"

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a plain semantic version (for example, 1.0.0)." >&2
            exit 1
          fi

          collection_version="$(awk -F': *' '/^version:/ {print $2; exit}' galaxy.yml | tr -d '[:space:]')"
          if [[ -z "${collection_version}" ]]; then
            echo "Could not read version from galaxy.yml." >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG}" != "${collection_version}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match galaxy.yml version ${collection_version}." >&2
            exit 1
          fi

          echo "Publishing zupersero.elastic ${collection_version}."

      - name: Build collection artifact
        shell: bash
        run: |
          set -euo pipefail
          ansible-galaxy collection build

          mapfile -t artifacts < <(find . -maxdepth 1 -type f -name 'zupersero-elastic-*.tar.gz' -print)
          if [[ "${#artifacts[@]}" -ne 1 ]]; then
            echo "Expected exactly one collection artifact, found ${#artifacts[@]}." >&2
            exit 1
          fi

          expected="./zupersero-elastic-${RELEASE_TAG}.tar.gz"
          if [[ "${artifacts[0]}" != "${expected}" ]]; then
            echo "Built artifact ${artifacts[0]} does not match ${expected}." >&2
            exit 1
          fi
          echo "COLLECTION_ARTIFACT=${expected}" >> "${GITHUB_ENV}"

      - name: Publish collection to Ansible Galaxy
        if: ${{ env.GALAXY_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          ansible-galaxy collection publish "${COLLECTION_ARTIFACT}" \
            --server https://galaxy.ansible.com/api/ \
            --api-key "${GALAXY_API_KEY}"

      - name: Fail when Galaxy API key is missing
        if: ${{ env.GALAXY_API_KEY == '' }}
        run: |
          echo "GALAXY_API_KEY repository secret is required to publish releases." >&2
          exit 1

      - name: Attach collection artifact to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" "${COLLECTION_ARTIFACT}" --repo "${GITHUB_REPOSITORY}" --clobber
