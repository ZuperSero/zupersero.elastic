---
- name: Prepare
  hosts: all
  gather_facts: true
  vars:
    elastic_agent_mock_dir: /tmp/elastic-agent-mock
    elastic_agent_mock_version: 9.2.0
    elastic_agent_mock_arch: x86_64
    elastic_agent_mock_name: "elastic-agent-{{ elastic_agent_mock_version }}-linux-{{ elastic_agent_mock_arch }}"
  tasks:
    - name: Install mock dependencies (Debian)
      ansible.builtin.apt:
        name:
          - python3
          - tar
          - gzip
        state: present
        update_cache: true
      when: ansible_facts["os_family"] == "Debian"

    - name: Install mock dependencies (RedHat)
      ansible.builtin.dnf:
        name:
          - python3
          - tar
          - gzip
        state: present
      when: ansible_facts["os_family"] == "RedHat"

    - name: Create mock directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ elastic_agent_mock_dir }}"
        - "{{ elastic_agent_mock_dir }}/www"
        - "{{ elastic_agent_mock_dir }}/build/{{ elastic_agent_mock_name }}"

    - name: Create fake Elastic Agent binary
      ansible.builtin.copy:
        dest: "{{ elastic_agent_mock_dir }}/build/{{ elastic_agent_mock_name }}/elastic-agent"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          set -eu

          if [ "${1:-}" = "version" ]; then
            echo "Elastic Agent version: {{ elastic_agent_mock_version }}"
            exit 0
          fi

          if [ "${1:-}" = "install" ]; then
            base_path="/opt"
            while [ "$#" -gt 0 ]; do
              case "$1" in
                --base-path)
                  base_path="$2"
                  shift 2
                  ;;
                *)
                  shift
                  ;;
              esac
            done

            install_dir="${base_path}/Elastic/Agent"
            mkdir -p "${install_dir}"
            cp "$0" "${install_dir}/elastic-agent"
            chmod 0755 "${install_dir}/elastic-agent"
            cat > /etc/systemd/system/elastic-agent.service <<'EOF'
          [Unit]
          Description=Mock Elastic Agent
          After=network.target

          [Service]
          Type=simple
          ExecStart=/bin/sleep infinity
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOF
            systemctl daemon-reload
            systemctl enable --now elastic-agent.service
            exit 0
          fi

          echo "unsupported command" >&2
          exit 1

    - name: Build fake Elastic Agent archive # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: >-
          tar -czf {{ elastic_agent_mock_dir }}/www/{{ elastic_agent_mock_name }}.tar.gz
          -C {{ elastic_agent_mock_dir }}/build {{ elastic_agent_mock_name }}
        creates: "{{ elastic_agent_mock_dir }}/www/{{ elastic_agent_mock_name }}.tar.gz"

    - name: Create mock API server
      ansible.builtin.copy:
        dest: "{{ elastic_agent_mock_dir }}/server.py"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          import json
          import os
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer

          ROOT = "{{ elastic_agent_mock_dir }}/www"
          STATE = "{{ elastic_agent_mock_dir }}/state.json"
          VERSION = "{{ elastic_agent_mock_version }}"

          def load_state():
              if os.path.exists(STATE):
                  with open(STATE, "r", encoding="utf-8") as state_file:
                      return json.load(state_file)
              return {
                  "items": [
                      {
                          "active": True,
                          "api_key": "existing-token",
                          "api_key_id": "existing-token-id",
                          "id": "existing-id",
                          "name": "existing",
                          "policy_id": "reuse-policy",
                      }
                  ]
              }

          def save_state(state):
              with open(STATE, "w", encoding="utf-8") as state_file:
                  json.dump(state, state_file)

          class Handler(SimpleHTTPRequestHandler):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, directory=ROOT, **kwargs)

              def send_json(self, data, status=200):
                  payload = json.dumps(data).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def do_GET(self):
                  if self.path == "/":
                      self.send_json({"version": {"number": VERSION}})
                      return
                  if self.path == "/api/fleet/enrollment_api_keys":
                      state = load_state()
                      self.send_json({"items": state["items"], "page": 1, "perPage": 10000, "total": len(state["items"])})
                      return
                  super().do_GET()

              def do_POST(self):
                  if self.path == "/api/fleet/enrollment_api_keys":
                      length = int(self.headers.get("Content-Length", "0"))
                      body = json.loads(self.rfile.read(length) or b"{}")
                      state = load_state()
                      item = {
                          "active": True,
                          "api_key": f"created-token-{body['policy_id']}",
                          "api_key_id": f"created-token-id-{body['policy_id']}",
                          "created_at": "2026-08-17T00:00:00.000Z",
                          "id": f"created-id-{body['policy_id']}",
                          "name": body.get("name", "created"),
                          "policy_id": body["policy_id"],
                      }
                      state["items"].append(item)
                      save_state(state)
                      self.send_json({"action": "created", "item": item})
                      return
                  self.send_json({"message": "not found"}, status=404)

          if __name__ == "__main__":
              ThreadingHTTPServer(("127.0.0.1", 18080), Handler).serve_forever()

    - name: Start mock API and artifact server
      ansible.builtin.command:
        cmd: "python3 {{ elastic_agent_mock_dir }}/server.py"
      async: 7200
      poll: 0
      changed_when: true

    - name: Wait for mock server
      ansible.builtin.uri:
        url: http://127.0.0.1:18080/
        method: GET
        status_code: 200
      register: _mock_server_status
      retries: 10
      delay: 1
      until: _mock_server_status.status == 200
