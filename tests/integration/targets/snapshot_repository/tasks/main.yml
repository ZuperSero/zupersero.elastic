---
- name: Test snapshot repository lifecycle
  module_defaults:
    zupersero.elastic.snapshot_repository:
      url: http://localhost:9200
      username: elastic
      password: changeme
  vars:
    repository: &repository
      name: integration-repository
      type: fs
      settings: {location: /tmp/snapshots/integration, compress: true}
  block:
    - name: Predict repository creation
      zupersero.elastic.snapshot_repository: *repository
      check_mode: true
      register: predicted
    - name: Create repository
      zupersero.elastic.snapshot_repository: *repository
      register: created
    - name: Repeat repository creation
      zupersero.elastic.snapshot_repository: *repository
      register: repeated
    - name: Update repository
      zupersero.elastic.snapshot_repository:
        name: integration-repository
        type: fs
        settings: {location: /tmp/snapshots/integration, compress: false}
      register: updated
    - name: Delete repository
      zupersero.elastic.snapshot_repository: {name: integration-repository, state: absent}
      register: deleted
    - name: Repeat repository deletion
      zupersero.elastic.snapshot_repository: {name: integration-repository, state: absent}
      register: deleted_again
    - name: Assert repository lifecycle
      ansible.builtin.assert:
        that: [predicted is changed, created is changed, repeated is not changed, updated is changed, deleted is changed, deleted_again is not changed]
  always:
    - name: Clean up repository
      zupersero.elastic.snapshot_repository: {name: integration-repository, state: absent}
