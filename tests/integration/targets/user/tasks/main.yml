---
- name: Test user module
  module_defaults:
    zupersero.elastic.user:
      url: http://localhost:9200
      auth_username: elastic
      auth_password: changeme
  block:
    - name: Create user in check mode
      zupersero.elastic.user:
        state: present
        username: test_integration_user
        password: thisisalongtestpassword
        roles:
          - superuser
        email: test_integration_user@example.com
        full_name: Test Integration User
        metadata:
          owner: qa
        enabled: true
      check_mode: true
      register: create_check

    - name: Assert user creation check mode
      ansible.builtin.assert:
        that:
          - create_check is changed
          - create_check.user.username == 'test_integration_user'
          - create_check.user.roles == ['superuser']
          - create_check.user.metadata.owner == 'qa'

    - name: Create user
      zupersero.elastic.user:
        state: present
        username: test_integration_user
        password: thisisalongtestpassword
        roles:
          - superuser
        email: test_integration_user@example.com
        full_name: Test Integration User
        metadata:
          owner: qa
        enabled: true
      register: create_user_result

    - name: Assert user was created
      ansible.builtin.assert:
        that:
          - create_user_result is changed
          - create_user_result.user.username == 'test_integration_user'
          - create_user_result.user.email == 'test_integration_user@example.com'
          - create_user_result.user.full_name == 'Test Integration User'
          - create_user_result.user.metadata.owner == 'qa'
          - create_user_result.user.enabled == true

    - name: Reconcile created user
      zupersero.elastic.user:
        state: present
        username: test_integration_user
        password: thisisalongtestpassword
        roles:
          - superuser
        email: test_integration_user@example.com
        full_name: Test Integration User
        metadata:
          owner: qa
        enabled: true
      register: create_user_result_idempotent

    - name: Assert user was not changed
      ansible.builtin.assert:
        that:
          - create_user_result_idempotent is not changed
          - create_user_result_idempotent.user.username == 'test_integration_user'
          - create_user_result_idempotent.user.email == 'test_integration_user@example.com'
          - create_user_result_idempotent.user.full_name == 'Test Integration User'
          - create_user_result_idempotent.user.metadata.owner == 'qa'
          - create_user_result_idempotent.user.enabled == true

    - name: Just by username idempotency check
      zupersero.elastic.user:
        state: present
        username: test_integration_user
      register: create_user_result_username_only

    - name: Assert user was not changed when only username is provided
      ansible.builtin.assert:
        that:
          - create_user_result_username_only is not changed
          - create_user_result_username_only.user.username == 'test_integration_user'
          - create_user_result_username_only.user.email == 'test_integration_user@example.com'
          - create_user_result_username_only.user.full_name == 'Test Integration User'
          - create_user_result_username_only.user.metadata.owner == 'qa'
          - create_user_result_username_only.user.enabled == true

    - name: Login with user
      ansible.builtin.uri:
        url: http://localhost:9200
        method: GET
        user: test_integration_user
        password: thisisalongtestpassword
        status_code: 200
      register: login_result

    - name: Assert login was successful
      ansible.builtin.assert:
        that:
          - login_result.status == 200
          - login_result.json.tagline == 'You Know, for Search'

    - name: Update user in check mode
      zupersero.elastic.user:
        state: present
        username: test_integration_user
        roles:
          - monitoring_user
          - superuser
        email: updated_test_user@example.com
        full_name: Updated Test Integration User
        metadata:
          owner: platform
          environment: integration
        enabled: true
      check_mode: true
      register: update_check

    - name: Assert user update check mode
      ansible.builtin.assert:
        that:
          - update_check is changed
          - update_check.user.roles | sort == ['monitoring_user', 'superuser']
          - update_check.user.email == 'updated_test_user@example.com'
          - update_check.user.metadata.owner == 'platform'

    - name: Confirm check mode did not update user
      zupersero.elastic.user:
        state: present
        username: test_integration_user
        roles:
          - superuser
        email: test_integration_user@example.com
        full_name: Test Integration User
        metadata:
          owner: qa
        enabled: true
      register: after_update_check

    - name: Assert user update check mode did not mutate state
      ansible.builtin.assert:
        that:
          - after_update_check is not changed

    - name: Update user fields
      zupersero.elastic.user:
        state: present
        username: test_integration_user
        roles:
          - monitoring_user
          - superuser
        email: updated_test_user@example.com
        full_name: Updated Test Integration User
        metadata:
          owner: platform
          environment: integration
        enabled: true
      register: update_user_result

    - name: Assert user fields were updated
      ansible.builtin.assert:
        that:
          - update_user_result is changed
          - update_user_result.user.roles | sort == ['monitoring_user', 'superuser']
          - update_user_result.user.email == 'updated_test_user@example.com'
          - update_user_result.user.full_name == 'Updated Test Integration User'
          - update_user_result.user.metadata.owner == 'platform'
          - update_user_result.user.metadata.environment == 'integration'
          - update_user_result.user.enabled == true

    - name: Reconcile updated user
      zupersero.elastic.user:
        state: present
        username: test_integration_user
        roles:
          - monitoring_user
          - superuser
        email: updated_test_user@example.com
        full_name: Updated Test Integration User
        metadata:
          owner: platform
          environment: integration
        enabled: true
      register: update_again

    - name: Assert user update is idempotent
      ansible.builtin.assert:
        that:
          - update_again is not changed

    - name: Rotate user password
      zupersero.elastic.user:
        state: present
        username: test_integration_user
        password: thisisanotherlongtestpassword
        update_password: always
      register: password_update

    - name: Assert password rotation reports a change
      ansible.builtin.assert:
        that:
          - password_update is changed

    - name: Login with updated user password
      ansible.builtin.uri:
        url: http://localhost:9200
        method: GET
        user: test_integration_user
        password: thisisanotherlongtestpassword
        status_code: 200

    - name: Disable user in check mode
      zupersero.elastic.user:
        state: present
        username: test_integration_user
        enabled: false
      check_mode: true
      register: disable_check

    - name: Assert user disable check mode
      ansible.builtin.assert:
        that:
          - disable_check is changed
          - disable_check.user.enabled == false

    - name: Disable user
      zupersero.elastic.user:
        state: present
        username: test_integration_user
        enabled: false
      register: disable_user_result

    - name: Assert user was disabled
      ansible.builtin.assert:
        that:
          - disable_user_result is changed
          - disable_user_result.user.username == 'test_integration_user'
          - disable_user_result.user.enabled == false

    - name: Reconcile disabled user
      zupersero.elastic.user:
        state: present
        username: test_integration_user
        enabled: false
      register: disable_again

    - name: Assert disabled user is idempotent
      ansible.builtin.assert:
        that:
          - disable_again is not changed

    - name: Delete user in check mode
      zupersero.elastic.user:
        state: absent
        username: test_integration_user
      check_mode: true
      register: delete_check

    - name: Assert user deletion check mode
      ansible.builtin.assert:
        that:
          - delete_check is changed
          - delete_check.user.username == 'test_integration_user'
          - delete_check.user.enabled == false

    - name: Delete user
      zupersero.elastic.user:
        state: absent
        username: test_integration_user
      register: delete_user_result

    - name: Assert user was deleted
      ansible.builtin.assert:
        that:
          - delete_user_result is changed
          - delete_user_result.user.username == 'test_integration_user'
          - delete_user_result.user.email == 'updated_test_user@example.com'
          - delete_user_result.user.full_name == 'Updated Test Integration User'
          - delete_user_result.user.metadata.owner == 'platform'
          - delete_user_result.user.enabled == false

    - name: Delete user again (should not change)
      zupersero.elastic.user:
        state: absent
        username: test_integration_user
      register: delete_user_result_again

    - name: Assert user deletion was idempotent
      ansible.builtin.assert:
        that:
          - delete_user_result_again is not changed

    - name: Create user with password hash
      zupersero.elastic.user:
        state: present
        username: test_integration_user
        # Precomputed bcrypt hash for password "password" to avoid external deps.
        password_hash: "$2b$12$GhvMmNVjRW29ulnudl.LbuAnUtN/LRfe1JsBm1Xu6LE3059z5Tr8m"
        roles:
          - superuser
        email: test_integration_user@example.com
        full_name: Test Integration User
        enabled: true
      register: create_user_with_hash_result

    - name: Assert user with password hash was created
      ansible.builtin.assert:
        that:
          - create_user_with_hash_result is changed
          - create_user_with_hash_result.user.username == 'test_integration_user'
          - create_user_with_hash_result.user.email == 'test_integration_user@example.com'
          - create_user_with_hash_result.user.full_name == 'Test Integration User'
          - create_user_with_hash_result.user.enabled == true

    - name: Delete user created with password hash
      zupersero.elastic.user:
        state: absent
        username: test_integration_user
      register: delete_user_with_hash_result

    - name: Assert user created with password hash was deleted
      ansible.builtin.assert:
        that:
          - delete_user_with_hash_result is changed

    - name: Verify creating a user without a password fails
      block:
        - name: Attempt to create user without a password
          zupersero.elastic.user:
            state: present
            username: test_integration_user_without_password
            roles:
              - superuser

        - name: Fail when missing password was accepted
          ansible.builtin.fail:
            msg: Creating a user without a password unexpectedly succeeded

      rescue:
        - name: Capture missing password failure
          ansible.builtin.set_fact:
            missing_password_result: "{{ ansible_failed_result }}"

    - name: Assert missing password is rejected
      ansible.builtin.assert:
        that:
          - missing_password_result is failed
          - "'requires either password or password_hash' in missing_password_result.msg"

    - name: Verify mutually exclusive password options fail
      block:
        - name: Attempt to use mutually exclusive password options
          zupersero.elastic.user:
            state: present
            username: test_integration_user_invalid_options
            password: thisisalongtestpassword
            password_hash: "$2b$12$GhvMmNVjRW29ulnudl.LbuAnUtN/LRfe1JsBm1Xu6LE3059z5Tr8m"
            roles:
              - superuser

        - name: Fail when mutually exclusive options were accepted
          ansible.builtin.fail:
            msg: Mutually exclusive password options unexpectedly succeeded

      rescue:
        - name: Capture mutually exclusive options failure
          ansible.builtin.set_fact:
            mutually_exclusive_result: "{{ ansible_failed_result }}"

    - name: Assert mutually exclusive password options are rejected
      ansible.builtin.assert:
        that:
          - mutually_exclusive_result is failed
          - "'mutually exclusive' in mutually_exclusive_result.msg"

  always:
    - name: Cleanup tests
      zupersero.elastic.user:
        state: absent
        username: "{{ item }}"
      failed_when: false
      loop:
        - test_integration_user
        - test_integration_user_without_password
        - test_integration_user_invalid_options
