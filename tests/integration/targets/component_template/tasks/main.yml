---
- name: Test Elasticsearch component template management
  module_defaults:
    zupersero.elastic.component_template:
      url: http://127.0.0.1:9200
      username: elastic
      password: changeme
  block:
    - name: Predict component template creation
      zupersero.elastic.component_template:
        name: phase1-component-template-integration
        settings:
          number_of_replicas: 0
        mappings:
          properties:
            phase:
              type: keyword
            count:
              type: integer
        aliases:
          "{index}-phase1-component":
            is_hidden: false
        version: 1
        metadata:
          owner: integration
        deprecated: false
      check_mode: true
      diff: true
      register: create_check

    - name: Assert predicted component template creation
      ansible.builtin.assert:
        that:
          - create_check is changed
          - create_check.status == 404
          - create_check.component_template.name == 'phase1-component-template-integration'
          - create_check.diff.before == {}
          - create_check.diff.after.template.settings.number_of_replicas == 0

    - name: Create component template
      zupersero.elastic.component_template:
        name: phase1-component-template-integration
        settings:
          number_of_replicas: 0
        mappings:
          properties:
            phase:
              type: keyword
            count:
              type: integer
        aliases:
          "{index}-phase1-component":
            is_hidden: false
        version: 1
        metadata:
          owner: integration
        deprecated: false
      diff: true
      register: create_result

    - name: Assert component template creation
      ansible.builtin.assert:
        that:
          - create_result is changed
          - create_result.status == 200
          - create_result.component_template.name == 'phase1-component-template-integration'
          - create_result.component_template.template.settings.index.number_of_replicas == '0'
          - create_result.component_template.template.mappings.properties.phase.type == 'keyword'
          - create_result.component_template.template.mappings.properties.count.type == 'integer'
          - create_result.component_template.template.aliases['{index}-phase1-component'].is_hidden == false
          - create_result.component_template.version == 1
          - create_result.component_template._meta.owner == 'integration'

    - name: Reconcile created component template
      zupersero.elastic.component_template:
        name: phase1-component-template-integration
        settings:
          number_of_replicas: 0
        mappings:
          properties:
            phase:
              type: keyword
            count:
              type: integer
        aliases:
          "{index}-phase1-component":
            is_hidden: false
        version: 1
        metadata:
          owner: integration
        deprecated: false
      diff: true
      register: create_idempotent

    - name: Assert created component template is unchanged
      ansible.builtin.assert:
        that:
          - create_idempotent is not changed
          - create_idempotent.diff.before == create_idempotent.diff.after

    - name: Predict partial component template update
      zupersero.elastic.component_template:
        name: phase1-component-template-integration
        settings:
          refresh_interval: 5s
        mappings:
          properties:
            description:
              type: text
        metadata:
          purpose: lifecycle
      check_mode: true
      diff: true
      register: update_check

    - name: Assert predicted component template update
      ansible.builtin.assert:
        that:
          - update_check is changed
          - update_check.diff.after.template.settings.refresh_interval == '5s'
          - update_check.diff.after.template.mappings.properties.description.type == 'text'
          - update_check.component_template.template.settings.number_of_replicas == '0'
          - update_check.component_template.template.mappings.properties.phase.type == 'keyword'
          - update_check.component_template._meta.owner == 'integration'
          - update_check.component_template._meta.purpose == 'lifecycle'

    - name: Read component template after check mode
      zupersero.elastic.component_template:
        name: phase1-component-template-integration
      register: check_mode_read

    - name: Assert check mode did not mutate component template
      ansible.builtin.assert:
        that:
          - check_mode_read is not changed
          - check_mode_read.component_template.template.settings.index.refresh_interval is not defined
          - check_mode_read.component_template.template.mappings.properties.description is not defined
          - check_mode_read.component_template._meta.purpose is not defined

    - name: Partially update component template
      zupersero.elastic.component_template:
        name: phase1-component-template-integration
        settings:
          refresh_interval: 5s
        mappings:
          properties:
            description:
              type: text
        metadata:
          purpose: lifecycle
      diff: true
      register: update_result

    - name: Assert update and omitted fields are preserved
      ansible.builtin.assert:
        that:
          - update_result is changed
          - update_result.status == 200
          - update_result.component_template.template.settings.index.refresh_interval == '5s'
          - update_result.component_template.template.settings.index.number_of_replicas == '0'
          - update_result.component_template.template.mappings.properties.description.type == 'text'
          - update_result.component_template.template.mappings.properties.phase.type == 'keyword'
          - update_result.component_template.template.mappings.properties.count.type == 'integer'
          - update_result.component_template.template.aliases['{index}-phase1-component'].is_hidden == false
          - update_result.component_template.version == 1
          - update_result.component_template._meta.owner == 'integration'
          - update_result.component_template._meta.purpose == 'lifecycle'

    - name: Reconcile partial component template update
      zupersero.elastic.component_template:
        name: phase1-component-template-integration
        settings:
          refresh_interval: 5s
        mappings:
          properties:
            description:
              type: text
        metadata:
          purpose: lifecycle
      diff: true
      register: update_idempotent

    - name: Assert updated component template is unchanged
      ansible.builtin.assert:
        that:
          - update_idempotent is not changed
          - update_idempotent.diff.before == update_idempotent.diff.after

    - name: Predict full replacement that clears component template state
      zupersero.elastic.component_template:
        name: phase1-component-template-integration
        replace: true
        settings: {}
        mappings: {}
        aliases: {}
        metadata: {}
      check_mode: true
      diff: true
      register: replace_check

    - name: Assert predicted component template replacement
      ansible.builtin.assert:
        that:
          - replace_check is changed
          - replace_check.component_template.template.settings == {}
          - replace_check.component_template.template.mappings == {}
          - replace_check.component_template.template.aliases == {}
          - replace_check.component_template._meta == {}
          - replace_check.component_template.version is not defined
          - replace_check.component_template.deprecated is not defined

    - name: Read component template after replacement check mode
      zupersero.elastic.component_template:
        name: phase1-component-template-integration
      register: replace_check_read

    - name: Assert replacement check mode did not clear state
      ansible.builtin.assert:
        that:
          - replace_check_read is not changed
          - replace_check_read.component_template.template.settings.index.refresh_interval == '5s'
          - replace_check_read.component_template.template.mappings.properties.description.type == 'text'
          - replace_check_read.component_template.template.aliases['{index}-phase1-component'].is_hidden == false
          - replace_check_read.component_template._meta.purpose == 'lifecycle'
          - replace_check_read.component_template.version == 1

    - name: Fully replace and clear component template state
      zupersero.elastic.component_template:
        name: phase1-component-template-integration
        replace: true
        settings: {}
        mappings: {}
        aliases: {}
        metadata: {}
      diff: true
      register: replace_result

    - name: Assert component template dictionaries and optional fields are cleared
      ansible.builtin.assert:
        that:
          - replace_result is changed
          - replace_result.status == 200
          - replace_result.component_template.template.settings | default({}) == {}
          - replace_result.component_template.template.mappings | default({}) == {}
          - replace_result.component_template.template.aliases | default({}) == {}
          - replace_result.component_template._meta | default({}) == {}
          - replace_result.component_template.version is not defined
          - replace_result.component_template.deprecated is not defined

    - name: Reconcile cleared component template replacement
      zupersero.elastic.component_template:
        name: phase1-component-template-integration
        replace: true
        settings: {}
        mappings: {}
        aliases: {}
        metadata: {}
      diff: true
      register: replace_idempotent

    - name: Assert cleared component template replacement is unchanged
      ansible.builtin.assert:
        that:
          - replace_idempotent is not changed
          - replace_idempotent.diff.before == replace_idempotent.diff.after

    - name: Read managed component template
      zupersero.elastic.component_template:
        name: phase1-component-template-integration
      register: read_result

    - name: Assert managed component template read outcome
      ansible.builtin.assert:
        that:
          - read_result is not changed
          - read_result.status == 200
          - read_result.component_template.name == 'phase1-component-template-integration'
          - read_result.component_template.template.settings | default({}) == {}
          - read_result.component_template.template.mappings | default({}) == {}
          - read_result.component_template.template.aliases | default({}) == {}
          - read_result.component_template._meta | default({}) == {}

    - name: Predict component template deletion
      zupersero.elastic.component_template:
        name: phase1-component-template-integration
        state: absent
      check_mode: true
      diff: true
      register: delete_check

    - name: Assert predicted component template deletion
      ansible.builtin.assert:
        that:
          - delete_check is changed
          - delete_check.component_template.name == 'phase1-component-template-integration'
          - delete_check.diff.after == {}

    - name: Delete component template
      zupersero.elastic.component_template:
        name: phase1-component-template-integration
        state: absent
      diff: true
      register: delete_result

    - name: Assert component template deletion
      ansible.builtin.assert:
        that:
          - delete_result is changed
          - delete_result.status == 200
          - delete_result.component_template.name == 'phase1-component-template-integration'

    - name: Delete missing component template
      zupersero.elastic.component_template:
        name: phase1-component-template-integration
        state: absent
      register: delete_idempotent

    - name: Assert missing component template deletion is unchanged
      ansible.builtin.assert:
        that:
          - delete_idempotent is not changed
          - delete_idempotent.status == 404
          - delete_idempotent.component_template is none

  always:
    - name: Cleanup managed component template
      zupersero.elastic.component_template:
        name: phase1-component-template-integration
        state: absent
      failed_when: false
