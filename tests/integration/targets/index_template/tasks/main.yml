---
- name: Test Elasticsearch composable index template management
  module_defaults:
    zupersero.elastic.index_template:
      url: http://127.0.0.1:9200
      username: elastic
      password: changeme
  block:
    - name: Predict index template creation
      zupersero.elastic.index_template:
        name: phase1-index-template-integration
        index_patterns:
          - phase1-template-events-*
        composed_of:
          - phase1-optional-component
        ignore_missing_component_templates:
          - phase1-optional-component
        settings:
          number_of_replicas: 0
        mappings:
          properties:
            phase:
              type: keyword
            count:
              type: integer
        aliases:
          phase1-template-events: {}
        priority: 120
        version: 1
        metadata:
          owner: integration
        data_stream: {}
        allow_auto_create: true
        deprecated: false
      check_mode: true
      diff: true
      register: create_check

    - name: Assert predicted index template creation
      ansible.builtin.assert:
        that:
          - create_check is changed
          - create_check.status == 404
          - create_check.index_template.name == 'phase1-index-template-integration'
          - create_check.diff.before == {}
          - create_check.diff.after.index_patterns == ['phase1-template-events-*']

    - name: Create index template
      zupersero.elastic.index_template:
        name: phase1-index-template-integration
        index_patterns:
          - phase1-template-events-*
        composed_of:
          - phase1-optional-component
        ignore_missing_component_templates:
          - phase1-optional-component
        settings:
          number_of_replicas: 0
        mappings:
          properties:
            phase:
              type: keyword
            count:
              type: integer
        aliases:
          phase1-template-events: {}
        priority: 120
        version: 1
        metadata:
          owner: integration
        data_stream: {}
        allow_auto_create: true
        deprecated: false
      diff: true
      register: create_result

    - name: Assert index template creation
      ansible.builtin.assert:
        that:
          - create_result is changed
          - create_result.status == 200
          - create_result.index_template.name == 'phase1-index-template-integration'
          - create_result.index_template.index_patterns == ['phase1-template-events-*']
          - create_result.index_template.composed_of == ['phase1-optional-component']
          - create_result.index_template.template.settings.index.number_of_replicas == '0'
          - create_result.index_template.template.mappings.properties.phase.type == 'keyword'
          - create_result.index_template.template.aliases['phase1-template-events'] == {}
          - create_result.index_template.priority == 120
          - create_result.index_template.version == 1
          - create_result.index_template._meta.owner == 'integration'
          - create_result.index_template.data_stream.hidden == false
          - create_result.index_template.allow_auto_create == true

    - name: Reconcile created index template
      zupersero.elastic.index_template:
        name: phase1-index-template-integration
        index_patterns:
          - phase1-template-events-*
        composed_of:
          - phase1-optional-component
        ignore_missing_component_templates:
          - phase1-optional-component
        settings:
          number_of_replicas: 0
        mappings:
          properties:
            phase:
              type: keyword
            count:
              type: integer
        aliases:
          phase1-template-events: {}
        priority: 120
        version: 1
        metadata:
          owner: integration
        data_stream: {}
        allow_auto_create: true
        deprecated: false
      diff: true
      register: create_idempotent

    - name: Assert created index template is unchanged
      ansible.builtin.assert:
        that:
          - create_idempotent is not changed
          - create_idempotent.diff.before == create_idempotent.diff.after

    - name: Predict partial index template update
      zupersero.elastic.index_template:
        name: phase1-index-template-integration
        index_patterns:
          - phase1-template-updated-*
        settings:
          refresh_interval: 5s
        mappings:
          properties:
            description:
              type: text
        metadata:
          purpose: lifecycle
      check_mode: true
      diff: true
      register: update_check

    - name: Assert predicted index template update
      ansible.builtin.assert:
        that:
          - update_check is changed
          - update_check.diff.before.index_patterns == ['phase1-template-events-*']
          - update_check.diff.after.index_patterns == ['phase1-template-updated-*']
          - update_check.diff.after.template.settings.refresh_interval == '5s'
          - update_check.diff.after.template.mappings.properties.description.type == 'text'
          - update_check.index_template.composed_of == ['phase1-optional-component']
          - update_check.index_template.template.settings.number_of_replicas == '0'
          - update_check.index_template.template.mappings.properties.phase.type == 'keyword'
          - update_check.index_template._meta.owner == 'integration'
          - update_check.index_template._meta.purpose == 'lifecycle'

    - name: Read index template after check mode
      zupersero.elastic.index_template:
        name: phase1-index-template-integration
      register: check_mode_read

    - name: Assert check mode did not mutate index template
      ansible.builtin.assert:
        that:
          - check_mode_read is not changed
          - check_mode_read.index_template.index_patterns == ['phase1-template-events-*']
          - check_mode_read.index_template.template.settings.index.refresh_interval is not defined
          - check_mode_read.index_template.template.mappings.properties.description is not defined
          - check_mode_read.index_template._meta.purpose is not defined

    - name: Partially update index template
      zupersero.elastic.index_template:
        name: phase1-index-template-integration
        index_patterns:
          - phase1-template-updated-*
        settings:
          refresh_interval: 5s
        mappings:
          properties:
            description:
              type: text
        metadata:
          purpose: lifecycle
      diff: true
      register: update_result

    - name: Assert update and omitted fields are preserved
      ansible.builtin.assert:
        that:
          - update_result is changed
          - update_result.status == 200
          - update_result.index_template.index_patterns == ['phase1-template-updated-*']
          - update_result.index_template.composed_of == ['phase1-optional-component']
          - update_result.index_template.ignore_missing_component_templates == ['phase1-optional-component']
          - update_result.index_template.template.settings.index.refresh_interval == '5s'
          - update_result.index_template.template.settings.index.number_of_replicas == '0'
          - update_result.index_template.template.mappings.properties.description.type == 'text'
          - update_result.index_template.template.mappings.properties.phase.type == 'keyword'
          - update_result.index_template.template.mappings.properties.count.type == 'integer'
          - update_result.index_template.template.aliases['phase1-template-events'] == {}
          - update_result.index_template.priority == 120
          - update_result.index_template.version == 1
          - update_result.index_template._meta.owner == 'integration'
          - update_result.index_template._meta.purpose == 'lifecycle'
          - update_result.index_template.data_stream.hidden == false
          - update_result.index_template.allow_auto_create == true

    - name: Reconcile partial index template update
      zupersero.elastic.index_template:
        name: phase1-index-template-integration
        index_patterns:
          - phase1-template-updated-*
        settings:
          refresh_interval: 5s
        mappings:
          properties:
            description:
              type: text
        metadata:
          purpose: lifecycle
      diff: true
      register: update_idempotent

    - name: Assert updated index template is unchanged
      ansible.builtin.assert:
        that:
          - update_idempotent is not changed
          - update_idempotent.diff.before == update_idempotent.diff.after

    - name: Predict full replacement that clears index template state
      zupersero.elastic.index_template:
        name: phase1-index-template-integration
        replace: true
        index_patterns:
          - phase1-template-replaced-*
        settings: {}
        mappings: {}
        aliases: {}
        metadata: {}
      check_mode: true
      diff: true
      register: replace_check

    - name: Assert predicted index template replacement
      ansible.builtin.assert:
        that:
          - replace_check is changed
          - replace_check.index_template.index_patterns == ['phase1-template-replaced-*']
          - replace_check.index_template.template.settings == {}
          - replace_check.index_template.template.mappings == {}
          - replace_check.index_template.template.aliases == {}
          - replace_check.index_template._meta == {}
          - replace_check.index_template.composed_of is not defined
          - replace_check.index_template.data_stream is not defined
          - replace_check.index_template.version is not defined

    - name: Read index template after replacement check mode
      zupersero.elastic.index_template:
        name: phase1-index-template-integration
      register: replace_check_read

    - name: Assert replacement check mode did not clear state
      ansible.builtin.assert:
        that:
          - replace_check_read is not changed
          - replace_check_read.index_template.index_patterns == ['phase1-template-updated-*']
          - replace_check_read.index_template.template.settings.index.refresh_interval == '5s'
          - replace_check_read.index_template.template.mappings.properties.description.type == 'text'
          - replace_check_read.index_template.template.aliases['phase1-template-events'] == {}
          - replace_check_read.index_template._meta.purpose == 'lifecycle'
          - replace_check_read.index_template.data_stream.hidden == false
          - replace_check_read.index_template.version == 1

    - name: Fully replace and clear index template state
      zupersero.elastic.index_template:
        name: phase1-index-template-integration
        replace: true
        index_patterns:
          - phase1-template-replaced-*
        settings: {}
        mappings: {}
        aliases: {}
        metadata: {}
      diff: true
      register: replace_result

    - name: Assert index template dictionaries and optional fields are cleared
      ansible.builtin.assert:
        that:
          - replace_result is changed
          - replace_result.status == 200
          - replace_result.index_template.index_patterns == ['phase1-template-replaced-*']
          - replace_result.index_template.composed_of == []
          - replace_result.index_template.template.settings | default({}) == {}
          - replace_result.index_template.template.mappings | default({}) == {}
          - replace_result.index_template.template.aliases | default({}) == {}
          - replace_result.index_template._meta | default({}) == {}
          - replace_result.index_template.data_stream is not defined
          - replace_result.index_template.ignore_missing_component_templates is not defined
          - replace_result.index_template.allow_auto_create is not defined
          - replace_result.index_template.priority is not defined
          - replace_result.index_template.version is not defined
          - replace_result.index_template.deprecated is not defined

    - name: Reconcile cleared index template replacement
      zupersero.elastic.index_template:
        name: phase1-index-template-integration
        replace: true
        index_patterns:
          - phase1-template-replaced-*
        settings: {}
        mappings: {}
        aliases: {}
        metadata: {}
      diff: true
      register: replace_idempotent

    - name: Assert cleared index template replacement is unchanged
      ansible.builtin.assert:
        that:
          - replace_idempotent is not changed
          - replace_idempotent.diff.before == replace_idempotent.diff.after

    - name: Read managed index template
      zupersero.elastic.index_template:
        name: phase1-index-template-integration
      register: read_result

    - name: Assert managed index template read outcome
      ansible.builtin.assert:
        that:
          - read_result is not changed
          - read_result.status == 200
          - read_result.index_template.name == 'phase1-index-template-integration'
          - read_result.index_template.index_patterns == ['phase1-template-replaced-*']
          - read_result.index_template.template.settings | default({}) == {}
          - read_result.index_template.template.mappings | default({}) == {}
          - read_result.index_template.template.aliases | default({}) == {}
          - read_result.index_template._meta | default({}) == {}
          - read_result.index_template.data_stream is not defined

    - name: Predict index template deletion
      zupersero.elastic.index_template:
        name: phase1-index-template-integration
        state: absent
      check_mode: true
      diff: true
      register: delete_check

    - name: Assert predicted index template deletion
      ansible.builtin.assert:
        that:
          - delete_check is changed
          - delete_check.index_template.name == 'phase1-index-template-integration'
          - delete_check.diff.after == {}

    - name: Delete index template
      zupersero.elastic.index_template:
        name: phase1-index-template-integration
        state: absent
      diff: true
      register: delete_result

    - name: Assert index template deletion
      ansible.builtin.assert:
        that:
          - delete_result is changed
          - delete_result.status == 200
          - delete_result.index_template.name == 'phase1-index-template-integration'

    - name: Delete missing index template
      zupersero.elastic.index_template:
        name: phase1-index-template-integration
        state: absent
      register: delete_idempotent

    - name: Assert missing index template deletion is unchanged
      ansible.builtin.assert:
        that:
          - delete_idempotent is not changed
          - delete_idempotent.status == 404
          - delete_idempotent.index_template is none

  always:
    - name: Cleanup managed index template
      zupersero.elastic.index_template:
        name: phase1-index-template-integration
        state: absent
      failed_when: false
